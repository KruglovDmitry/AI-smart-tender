[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-agent"
version = "0.1.0"
description = "Браузерный агент поиска закупок: наблюдение, шаг, проверка."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "playwright>=1.49",
  "pydantic>=2.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tender-agent = "tender_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
