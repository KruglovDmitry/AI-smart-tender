<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Canvas only</title>
  <style>
    body { margin: 0; }
    canvas { width: 800px; height: 600px; display: block; background: #ddd; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="600"></canvas>
  <script>
    const ctx = document.getElementById('c').getContext('2d');
    ctx.fillStyle = '#3366cc';
    ctx.fillRect(40, 100, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText('Документы', 70, 125);
  </script>
</body>
</html>
