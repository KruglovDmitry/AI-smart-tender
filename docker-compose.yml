# Дистрибутив / обычный запуск у клиента.
# Dev (build + mount кода): docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: tender-open-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      # Чат-модели настраиваются в UI (Connections). Ollama не используем.
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=${RAG_EMBEDDING_MODEL_AUTO_UPDATE:-false}
      - WHISPER_MODEL_AUTO_UPDATE=${WHISPER_MODEL_AUTO_UPDATE:-false}
      - TOOL_SERVER_CONNECTIONS=${TOOL_SERVER_CONNECTIONS}
    volumes:
      - open-webui-data:/app/backend/data
      - ${DATA_HOST_PATH:-./data}:/data
      # Локальная папка тендеров пользователя перекрывает data/tenders
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tools-server
      - tender-agent
    restart: unless-stopped

  tools-server:
    image: ${TOOLS_IMAGE:-dim4098/ai-smart-tender-tools:1.3.0}
    build: ./tools-server
    container_name: tender-tools
    ports:
      - "${TOOLS_PORT:-8000}:8000"
    environment:
      - DATA_ROOT=/data
      - DEFAULT_MAX_CHARS=${DEFAULT_MAX_CHARS:-120000}
      - DEFAULT_MAX_FILES=${DEFAULT_MAX_FILES:-30}
      - FETCH_TIMEOUT_SEC=${FETCH_TIMEOUT_SEC:-30}
      - TOOLS_PUBLIC_BASE_URL=${TOOLS_PUBLIC_BASE_URL:-http://localhost:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/data
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders
    restart: unless-stopped

  tender-agent:
    image: ${TENDER_AGENT_IMAGE:-tender-agent:0.1.0}
    build: ./tender_agent
    container_name: tender-agent
    ports:
      - "${TENDER_AGENT_PORT:-8010}:8010"
    environment:
      - TENDER_AGENT_DATA_DIR=/data/tenders
      - TENDER_AGENT_HEADLESS=${BROWSER_HEADLESS:-true}
      - TENDER_AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-}
      - TENDER_AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY:-}
      - TENDER_AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-deepseek-flash}
      - TENDER_AGENT_MAX_ACTIONS=${TENDER_AGENT_MAX_ACTIONS:-40}
      - TENDER_AGENT_MAX_LLM_CALLS=${TENDER_AGENT_MAX_LLM_CALLS:-12}
      - TENDER_AGENT_TIMEOUT_SECONDS=${TENDER_AGENT_TIMEOUT_SECONDS:-120}
      - TENDER_AGENT_MAX_PAGES=${TENDER_AGENT_MAX_PAGES:-5}
      - TENDER_AGENT_DEFAULT_LIMIT=${TENDER_AGENT_DEFAULT_LIMIT:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/data
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders
    shm_size: "1gb"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: ${DASHBOARD_IMAGE:-tenag-dashboard:1.0.0}
    container_name: tender-dashboard
    ports:
      - "${DASHBOARD_PORT:-3100}:8000"
    environment:
      - DATA_ROOT=/data
      - TOOLS_SERVER_URL=http://tools-server:8000
      - TENDER_AGENT_URL=http://tender-agent:8010
      - SEEN_TENDERS_DB=${SEEN_TENDERS_DB:-/data/_state/seen_tenders.sqlite3}
    volumes:
      - ${DATA_HOST_PATH:-./data}:/data
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders
    depends_on:
      - tools-server
      - tender-agent
    restart: unless-stopped

volumes:
  open-webui-data:
