services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: tender-open-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}
      # Пустой ключ = Open WebUI берёт уже сохранённый из volume (сессии не слетают)
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=${RAG_EMBEDDING_MODEL_AUTO_UPDATE:-false}
      - WHISPER_MODEL_AUTO_UPDATE=${WHISPER_MODEL_AUTO_UPDATE:-false}
      # Global OpenAPI Tool Server (доступен в чате после включения у модели)
      - TOOL_SERVER_CONNECTIONS=${TOOL_SERVER_CONNECTIONS}
    volumes:
      # Существующий volume со всеми пользователями / чатами / настройками
      - open-webui:/app/backend/data
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - tools-server
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: tender-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Модели, уже скачанные в текущем open-webui:ollama
      - ollama:/root/.ollama
    restart: unless-stopped

  tools-server:
    build: ./tools-server
    container_name: tender-tools
    ports:
      - "${TOOLS_PORT:-8000}:8000"
    environment:
      - DATA_ROOT=/data
      - DEFAULT_MAX_CHARS=${DEFAULT_MAX_CHARS:-120000}
      - DEFAULT_MAX_FILES=${DEFAULT_MAX_FILES:-30}
      - FETCH_TIMEOUT_SEC=${FETCH_TIMEOUT_SEC:-30}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - BROWSER_AGENT_ENABLED=${BROWSER_AGENT_ENABLED:-false}
      - BROWSER_MAX_STEPS=${BROWSER_MAX_STEPS:-20}
      - BROWSER_VIEWPORT_WIDTH=${BROWSER_VIEWPORT_WIDTH:-1280}
      - BROWSER_VIEWPORT_HEIGHT=${BROWSER_VIEWPORT_HEIGHT:-900}
      - AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY:-}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-qwen-max}
      - AGENT_VL_MODEL=${AGENT_VL_MODEL:-qwen-vl-plus}
      - AGENT_VL_ENABLED=${AGENT_VL_ENABLED:-true}
    volumes:
      - ./data:/data
      - ./tools-server/app:/app/app
      - browser-profile:/tmp/tender-browser-profile
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  open-webui:
    external: true
  ollama:
    external: true
  browser-profile:
