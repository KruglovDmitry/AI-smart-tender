<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сортировка переключателями</title>
<style>.opt input { position: absolute; opacity: 0; width: 0; height: 0; } .opt span { cursor: pointer; }</style></head>
<body>
<div class="sorting">
  <label class="opt"><input type="radio" name="sort" value="default" checked><span>По умолчанию</span></label>
  <label class="opt"><input type="radio" name="sort" value="date_down"><span>Дата публикации (по убыванию)</span></label>
</div>
</body></html>
