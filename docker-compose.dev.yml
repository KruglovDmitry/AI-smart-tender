# Локальная разработка: сборка из исходников + hot-reload кода tools-server.
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  tools-server:
    image: tender-tools:dev
    build: ./tools-server
    volumes:
      - ./tools-server/app:/app/app
      - ${DATA_HOST_PATH:-./data}:/data
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders

  tender-agent:
    image: tender-agent:dev
    build: ./tender_agent

  dashboard:
    image: tenag-dashboard:dev
    build: ./dashboard
    volumes:
      - ./dashboard/app:/app/app
      - ./dashboard/static:/app/static
      - ${DATA_HOST_PATH:-./data}:/data
      - ${TENDERS_HOST_PATH:-./data/tenders}:/data/tenders
