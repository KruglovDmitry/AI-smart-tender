<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font: 13px "Segoe UI", system-ui, sans-serif; background: #f4f4f2; color: #2b2b2b; }
  @media (prefers-color-scheme: dark) { html, body { background: #1f1f1f; color: #e6e6e6; } }
  body { display: flex; align-items: center; gap: 12px; padding: 0 10px; box-sizing: border-box; user-select: none; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: rgba(127,127,127,.16); }
  .seg button { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 26px;
    border: none; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; opacity: .65; }
  .seg button:hover { opacity: 1; }
  .seg button.active { background: #fff; opacity: 1; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) { .seg button.active { background: #3a3a3a; } }
  .title { font-weight: 600; opacity: .8; }
  .status { margin-left: auto; display: flex; gap: 12px; opacity: .75; font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #999; }
  .dot.ready { background: #22a35a; } .dot.starting { background: #e0a400; } .dot.failed { background: #d23c3c; }
</style>
</head>
<body>
  <div class="seg" role="tablist" aria-label="Окно">
    <button id="tab-chat" role="tab" title="Чат (Ctrl+1)" aria-label="Чат">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>
    </button>
    <button id="tab-dashboard" role="tab" title="Дашборд (Ctrl+2)" aria-label="Дашборд">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
    </button>
  </div>
  <span class="title" id="title">Чат</span>
  <div class="status" id="status"></div>
  <script src="toolbar.js"></script>
</body>
</html>
